[package]
name = "illustash-desktop"
version = "0.3.1"
edition = "2021"
description = "Illustash 桌面外壳：启动原生 HTTP 服务、承载 Pixiv 登录窗口；不承载业务逻辑"
license = "GPL-3.0-or-later"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
illustash-platform = { path = "../crates/platform" }
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tauri-plugin-dialog = "2"
# 应用内更新（#279，updater.rs）。默认特性：rustls、系统代理、zip。
tauri-plugin-updater = "2.14"
tokio = { version = "1", features = ["time"] }
getrandom = "0.3"
libc = "0.2"
# 词条核心链进外壳：外壳兼当 illustash-terms 命令行（main.rs），版本与外壳一致，不另带边车程序。
illustash-terms = { path = "../native/terms" }

# macOS：关窗后在后台继续时的系统通知和 App Nap 声明（#451，notify.rs）；把图拖到别的应用（#450，drag.rs）；
# 显式打开 WKWebView 的 tabFocusesLinks（#761，webview.rs），并同步系统「降低透明度」设置（#755，transparency.rs）。
# 都用 Tauri 已经带进来的同一版本，只多开几个 feature。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSBundle", "NSError", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSProcessInfo", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphicsContext", "NSImage", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKPreferences", "WKUserContentController", "WKUserScript", "WKWebView", "WKWebViewConfiguration"] }

# Windows：后台时的托盘图标、toast 通知、再次打开时回到已在运行的那个（#451）；拖出（#450，drag.rs，Win32_* 那几项）。
[target.'cfg(windows)'.dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[dev-dependencies]
# 本机 HTTP 服务器模拟更新包在响应中途断开，使用更新插件相同的客户端。
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libtest-mimic = "0.8"

# macOS 的 WebKit API 需要在主线程访问，用独立测试入口运行。
[[test]]
name = "wkwebview_tab_focus"
harness = false

[[test]]
name = "wkwebview_transparency"
harness = false

[profile.release]
strip = true

# 与 illustash-terms 用同一份 tiny_http（#25）：它的 HTTP 宿主需要 vendored 版本里的连接数限制。
[patch.crates-io]
tiny_http = { path = "../native/terms/vendor/tiny_http" }

# 2026-10-29 用户定：每个 unsafe 块和 unsafe impl 都写 `// SAFETY:` 注释；生产代码不用 unwrap，
# 确实不会失败的地方用 expect 写明理由。测试里的 unwrap 由仓库根目录的 clippy.toml 放行。
[lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

# dev 构建少带调试信息（#362）：自己的 crate 只带行号表，panic 和测试失败的回溯里仍有文件名和行号；
# 第三方依赖不带调试信息。只动 dev profile，release 不变。做法和数字见 docs/LOCAL_CHECKS.md。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.illustash-platform]
debug = "line-tables-only"

[profile.dev.package.illustash-core]
debug = "line-tables-only"

[profile.dev.package.illustash-terms]
debug = "line-tables-only"

[profile.dev.package.illustash-relation-fft]
debug = "line-tables-only"
