[package]
name = "illustash-terms"
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
description = "Illustash 应用宿主：Core 适配、CLI、HTTP、任务编排和平台能力"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
illustash-relation-fft = { path = "../../crates/relation-fft" }
illustash-platform = { path = "../../crates/platform" }
illustash-core = { path = "../../crates/core" }
rusqlite = { version = "0.41", default-features = false, features = ["cache", "bundled", "functions", "backup", "hooks", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
getrandom = "0.3"
tiny_http = "0.12"
libc = "0.2"
csv = "1.3"
sha1 = "0.10"
unicode-normalization = "=0.1.22" # Unicode 15.0，与 Python 3.12 契约一致
flate2 = { version = "1", default-features = false, features = ["zlib"] }
image = { version = "=0.25.6", default-features = false, features = ["png", "gif", "webp", "tiff", "bmp", "ico", "pnm", "tga"] }
gif = "=0.13.3"
half = "2.7"
lcms2 = { version = "=5.6.0", features = ["static"] }
lcms2-sys = { version = "=4.0.7", default-features = false, features = ["static"] }
kamadak-exif = "0.6"
tiff = "=0.9.1" # image 已锁定此版本；在与 Pillow 等价的缩放之前保留原始 CMYK。
tiff_display = { package = "tiff", version = "=0.10.3" } # 用于紧缩、LA、平面排列的显示采样；保持 MSRV 1.82。
mozjpeg = { version = "0.10", default-features = false, features = ["with_simd"] }
fast_image_resize = "=4.2.3"
md-5 = "0.10"
chrono = "0.4"
# 只用 CPU 的推理会话；运行库是显式安装的资源，从不由 Cargo 下载。
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }

ureq = { version = "=2.12.1", features = ["json"] }
# zip 9 的 bzip2-rs 特性沿用原来的 bzip2-sys 后端。
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib", "bzip2-rs"] }
lzma-rs = "=0.3.0"
crc32fast = "1"

url = "=2.5.8"
regex = "=1.13.1"
httpdate = "=1.0.3"
serde_path_to_error = "0.1"
# 数据包目录的签名（#602）：和应用更新同一种 minisign 格式，校验库与桌面外壳的更新插件同一版本。
minisign-verify = "=0.3.0"
base64 = "0.22"

# 读路由测试用的核心读宿主只存在于需显式构建的 example 中，从不进入发布的 CLI。
[features]
test-read-host = ["illustash-core/verify-incremental"]

# 测试构建（cargo test，含录制重放与固定契约启动的二进制）编进核心的对照核对；普通 cargo build 不编进去（#102）。
[dev-dependencies]
illustash-core = { path = "../../crates/core", features = ["verify-incremental"] }

[build-dependencies]
serde_json = "1"

[[example]]
name = "read-http"
required-features = ["test-read-host"]

# dev 构建少带调试信息（#362）：自己的 crate 只带行号表，panic 和测试失败的回溯里仍有文件名和行号；
# 第三方依赖不带调试信息。只动 dev profile，release 不变。做法和数字见 docs/LOCAL_CHECKS.md。
[profile.dev]
debug = "line-tables-only"

# 对照基准重放（tests/baseline.rs）在每次录制的调用之后读取所有表；内置的 SQLite 不优化时，
# 这会成为 `cargo test` 中最慢的部分。
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# tests/baseline.rs 在约 9,000 次录制调用的每一次之后比较所有表；不优化的依赖（哈希、正则遮盖、JSON、gzip、
# SQLite 绑定）占去大部分时间（#130）。我们自己的 crate 保持 dev 级别，改动它们时重新构建的速度和以前一样快。
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.package.illustash-relation-fft]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package.illustash-core]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package.illustash-platform]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package.tiny_http]
opt-level = 0

# tiny_http 0.12 没有按连接的超时和连接数上限（#25）；vendored 副本加了 `Server::from_listener_with_limits`。
# 每个链接本 crate 的构建根都要重复这条 patch。
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

# 2026-10-29 用户定：每个 unsafe 块和 unsafe impl 都写 `// SAFETY:` 注释；生产代码不用 unwrap，
# 确实不会失败的地方用 expect 写明理由。测试里的 unwrap 由仓库根目录的 clippy.toml 放行。
[lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
