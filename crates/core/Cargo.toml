[package]
name = "illustash-core"
version = "0.4.2"
edition = "2021"
rust-version = "1.82"
description = "Illustash 连接内业务规则、证据、人工裁决、关系、历史和投影"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
rusqlite = { version = "0.41", default-features = false, features = ["cache", "bundled", "functions", "backup", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
getrandom = "0.3"
unicode-normalization = "=0.1.22"
regex = "=1.13.1"

# 「增量结果 = 整表重建」的对照核对（#102）：只给测试构建用，由环境变量 ILLUSTASH_TEST_VERIFY_INCREMENTAL 打开。
# 产品构建不启用它。
[features]
verify-incremental = []

# 2026-10-29 用户定：每个 unsafe 块和 unsafe impl 都写 `// SAFETY:` 注释；生产代码不用 unwrap，
# 确实不会失败的地方用 expect 写明理由。测试里的 unwrap 由仓库根目录的 clippy.toml 放行。
[lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

# dev 构建少带调试信息（#362）：自己的 crate 只带行号表，panic 和测试失败的回溯里仍有文件名和行号；
# 第三方依赖不带调试信息。只动 dev profile，release 不变。做法和数字见 docs/LOCAL_CHECKS.md。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
