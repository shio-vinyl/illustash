<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Illustash</title>
<style>
/* 与图库页的启动画面（web/static/app.css 的 #splash，颜色取 web/static/css/tokens.css 的令牌）保持同一尺寸和配色，跳转时画面才接得上。外壳页拿不到图库页的主题设置，跟随系统。 */
:root{color-scheme:light dark;--ink:#1b1b1f;--muted:#8b8b94;--line:#e8e8ec;--accent:#7c80d8;--warn:#e08a2c;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC",sans-serif;font-size:13px;font-synthesis:none}
@media (prefers-color-scheme:dark){:root{--ink:#eeeef2;--muted:#9a9aa3;--line:#3a3a41;--accent:#a1a4f3;--warn:#f0a04b}}
body{margin:0;height:100vh;overflow:hidden;background:#f6f5fd}
@media (prefers-color-scheme:dark){body{background:#222227}}
#splash{position:fixed;inset:0;display:grid;place-items:center;cursor:default}
#splash .sp-bg{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 42%,#fff 0%,#f6f5fd 55%,#ecebf9 100%)}
@media (prefers-color-scheme:dark){#splash .sp-bg{background:radial-gradient(120% 90% at 50% 42%,#2b2b33 0%,#222227 55%,#1b1b1f 100%)}}
#splash .sp-col{position:relative;display:grid;justify-items:center}
#splash .sp-icon{width:128px;height:128px;position:relative;transform-origin:0 0}
#splash .sp-icon svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform-origin:50% 95%}
#splash .sp-name{margin-top:18px;font-weight:650;font-size:32px;letter-spacing:.12em;color:var(--ink);display:flex;white-space:nowrap;transform-origin:0 0}
#splash .sp-name span{display:inline-block;opacity:0}
#splash .sp-status{margin-top:18px;display:grid;justify-items:center;gap:8px;width:240px;opacity:0}
#splash .sp-text{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#splash .sp-track{width:100%;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
#splash .sp-fill{display:block;height:100%;width:0;border-radius:2px;background:var(--accent)}
/* 启动失败：卡片停下，进度条换成原因和最后几行输出 */
.sp-error{display:none;margin-top:18px;max-width:560px;padding:0 24px;text-align:center}
.sp-error p{margin:0;color:var(--ink);font-size:13px;white-space:pre-line}
.sp-error pre{text-align:left;white-space:pre-wrap;font-size:12px;color:var(--muted);max-height:40vh;overflow:auto;margin:12px 0 0}
.failed #splash .sp-status{display:none}
.failed .sp-error{display:block}
/* 加载中可以改选别的图库；失败后可以重试、改选或新建 */
button{font:inherit;color:inherit;cursor:pointer}
.sp-switch{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:6px}
.sp-switch:hover{color:var(--ink);background:var(--line)}
.sp-actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.sp-actions[hidden]{display:none}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 14px;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
/* 欢迎页：没有能打开的图库时 */
:root{--sheet:#fff;--soft:#f2f2f5}
@media (prefers-color-scheme:dark){:root{--sheet:#28282d;--soft:#323238}}
#welcome{display:none;position:fixed;inset:0;overflow:auto;background:radial-gradient(120% 90% at 50% 42%,#fff 0%,#f6f5fd 55%,#ecebf9 100%)}
@media (prefers-color-scheme:dark){#welcome{background:radial-gradient(120% 90% at 50% 42%,#2b2b33 0%,#222227 55%,#1b1b1f 100%)}}
.welcoming #splash{display:none}
.welcoming #welcome{display:block}
.w-col{max-width:680px;margin:0 auto;padding:56px 24px 40px;color:var(--ink)}
.w-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.w-head img{width:56px;height:56px}
.w-head h1{margin:0;font-size:26px;font-weight:650}
.w-note{color:var(--muted);font-size:12.5px;line-height:1.6;margin:0 0 14px}
.w-recent{display:grid;gap:6px;margin:0 0 18px}
.w-recent button{display:block;width:100%;text-align:left;border:0;background:var(--sheet);border-radius:12px;padding:10px 14px;box-shadow:0 0 0 1px var(--line)}
.w-recent button:hover{box-shadow:0 0 0 1px var(--accent)}
.w-recent small{display:block;color:var(--muted);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.w-recent b{font-weight:600;font-size:13.5px}
.w-form{margin-top:18px;padding:14px;border-radius:14px;background:var(--soft)}
.w-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.w-col-box{background:var(--sheet);border-radius:10px;padding:8px 10px;box-shadow:0 0 0 1px var(--line);min-width:0}
.w-col-box h3{margin:0 0 6px;font-size:12px;font-weight:600}
.w-picked{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.w-picked span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.w-picked button{border:0;background:none;color:var(--muted);padding:0 4px}
.w-col-box .btn{margin-top:6px;padding:3px 10px;font-size:12px}
.w-line{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:12.5px}
.w-line input[type=text]{flex:1;height:30px;border:0;border-radius:999px;background:var(--sheet);padding:0 12px;color:var(--ink);box-shadow:0 0 0 1px var(--line);font:inherit}
.w-error{color:var(--warn);font-size:12.5px;margin:10px 0 0;min-height:1em}
.w-entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:4px 0 0}
.w-entry{display:flex;flex-direction:column;gap:4px;text-align:left;border:0;background:var(--sheet);border-radius:12px;padding:12px 14px;box-shadow:0 0 0 1px var(--line)}
.w-entry:hover:not(:disabled){box-shadow:0 0 0 1px var(--accent)}
.w-entry.on{box-shadow:0 0 0 2px var(--accent)}
.w-entry b{font-size:13.5px;font-weight:600}
.w-entry small{color:var(--muted);font-size:11.5px;line-height:1.5}
.w-entry:disabled{opacity:.5;cursor:default}
.w-check{font-size:11px;color:var(--muted);margin:0 0 4px 2px;line-height:1.45}
.w-check.warn{color:var(--warn)}
.w-track{height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.w-track span{display:block;height:100%;background:var(--accent);transition:width .3s}
.w-created{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sheet);box-shadow:0 0 0 1px var(--warn)}
.w-created p{margin:0 0 6px;font-size:12.5px;line-height:1.55}
</style></head>
<body>
<div id="splash" data-shell><div class="sp-bg"></div><div class="sp-col"><div class="sp-icon"><svg viewBox="302 291 650 650" fill="none"></svg></div><div class="sp-name">Illustash</div><div class="sp-status"><span class="sp-text" data-t>正在启动本地服务…</span><span class="sp-track"><span class="sp-fill"></span></span><button class="sp-switch" id="switch" data-t>选择其他图库</button></div><div class="sp-error"><p id="msg"></p><pre id="log" hidden></pre>
<div class="sp-actions" id="failActs"><button class="btn primary" data-act="retry" data-t>重试</button><button class="btn" data-act="choose" data-t>选择其他图库</button><button class="btn" data-act="create" data-t>新建图库</button></div>
<div class="sp-actions" id="upgradeActs" hidden><button class="btn primary" data-act="upgrade" data-t>升级并打开</button><button class="btn" data-act="choose" data-t>选择其他图库</button></div>
<div class="sp-actions" id="rescueActs" hidden><button class="btn primary" data-act="rescue" data-t>抢救重建</button><button class="btn" data-act="choose" data-t>选择其他图库</button></div></div></div></div>
<div id="welcome"><div class="w-col" id="wcol"></div></div>
<div id="diagnosticActions" hidden style="position:fixed;bottom:12px;right:12px;z-index:10"><button class="btn" id="diagnosticCopy" data-t>复制诊断信息</button><button class="btn" id="diagnosticExport" data-t>查看诊断信息</button><span id="diagnosticNotice" role="status"></span></div>
<dialog id="diagnosticDialog"><p data-t>运行错误仅保存在本机，最多 128 条、保留 14 天；不会自动上传，不含图片、文件名、路径或账号凭据。</p><textarea id="diagnosticText" readonly style="width:70vw;height:45vh"></textarea><form method="dialog"><button class="btn" data-t>关闭</button></form></dialog>
<!-- i18n.js、splash.js 由 desktop/build.rs 从 web/static/ 复制过来，两边用同一份；语言和译文表由外壳在页面加载前注入（desktop/src/i18n.rs） -->
<script src="i18n.js"></script>
<script src="splash.js"></script>
<script>
// 外壳转发本地服务的启动进度：done 为 0–1 的整体比例。进度条只走到 90%，剩下的留给图库页自己的加载。
// 阶段名是本地服务发来的中文，和图库页一样经 tb() 按模板翻译（#173）。
window.showProgress = (done, stage) => {
  if (document.body.classList.contains('failed') || !window.splash) return;
  splash.status(`${tb(stage)} ${Math.floor(done * 100)}%`);
  splash.progress(done * .9);
};
// 外壳在安装更新（#279，desktop/src/updater.rs）：图库页已经关了，装好后应用自己重新打开。
window.showUpdating = version => {
  if (!window.splash) return;
  document.body.classList.remove('failed');
  splash.status(t('正在安装 {version}，装好后会重新打开 Illustash', {version}));
};
// 本地服务就绪：等折叠动画播完再打开图库页（地址里带 launched，图库页从成形的图标接着走）。
window.launch = async url => {
  if (document.body.classList.contains('failed')) return;
  if (window.splash) { splash.progress(.9); await splash.settled(); }
  location.replace(url);
};
// 只有本地启动页能调用这些命令（capabilities/main.json）。
const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
const busy = on => document.querySelectorAll('button').forEach(b => { b.disabled = on; });
// 从原生白名单读取，永远不复制页面错误文字或原始 stderr。
async function diagnosticText() {
  const report = await invoke('startup_diagnostics');
  if (window.currentDiagnostic) report.current = window.currentDiagnostic;
  return JSON.stringify(report, null, 2);
}
document.getElementById('diagnosticCopy').onclick = async () => {
  try { await navigator.clipboard.writeText(await diagnosticText()); document.getElementById('diagnosticNotice').textContent = t('诊断信息已复制'); }
  catch { document.getElementById('diagnosticNotice').textContent = t('无法访问剪贴板，请查看诊断信息并手动复制'); }
};
document.getElementById('diagnosticExport').onclick = async () => {
  try {
    const text = await diagnosticText();
    // 系统 WebView 未必支持下载；始终提供可选中的文本作为反馈入口。
    const field = document.getElementById('diagnosticText'); field.value = text;
    document.getElementById('diagnosticDialog').showModal(); field.focus(); field.select();
  } catch { document.getElementById('diagnosticNotice').textContent = t('诊断记录暂不可读'); }
};
document.getElementById('switch').onclick = () => { busy(true); invoke('startup_choose', {create: false}); };
for (const acts of document.querySelectorAll('.sp-actions')) acts.onclick = e => {
  const act = e.target.closest('[data-act]')?.dataset.act; if (!act) return;
  busy(true);
  if (act === 'upgrade') { invoke('startup_upgrade'); return; }
  if (act === 'rescue') { invoke('startup_rescue'); return; }
  invoke(act === 'retry' ? 'startup_retry' : 'startup_choose', act === 'retry' ? {} : {create: act === 'create'});
};
// 欢迎页：没有能打开的图库、用户改选或启动失败后改选时显示。三个入口：新建（按出处分栏添加文件夹，出处由用户指定）、
// 打开已有图库、从导出包导入。添加的文件夹当场检查（只读，#95）；出错时表单原样保留。
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const home = p => String(p || '').replace(/^\/Users\/[^/]+/, '~').replace(/^C:\\Users\\[^\\]+/i, '~');
const number = n => Number(n || 0).toLocaleString(typeof I18N === 'object' ? I18N.locale : 'zh-CN');
const IMPORT_STAGES = {reading: t('正在读取导出包'), unpacking: t('正在解压'), cleaning: t('正在清除模型连接设置和联网授权'), checking: t('正在检查新图库能否打开'), publishing: t('正在登记新图库')};
let W = null;
window.showWelcome = state => {
  // state.photos: whether this platform can read the Photos library (macOS); W.photos: whether it is ticked.
  // W.seq: the picked folders in the order they were added, [origin, path]; W.info: what the check found for each path.
  // Origin names come from the core in Chinese: shown through tb() like the library page.
  W = {...state, origins: (state.origins || []).map(o => ({...o, label: tb(o.label)})), photosOk: !!state.photos, photos: false, form: !!state.create || !(state.recent || []).length, seq: [], info: {}, notes: [], name: '', error: '', importing: null, created: null};
  document.body.classList.remove('failed');
  document.body.classList.add('welcoming');
  document.getElementById('diagnosticActions').hidden = false;
  busy(false);
  window.splash?.halt();
  renderWelcome();
};
const originName = id => (W.origins || []).find(o => o.id === id)?.label || id;
function folderCheck(origin, path) {
  const r = W.info[path];
  if (!r) return `<div class="w-check">${t('正在检查…')}</div>`;
  const inside = r.inside && W.seq.find(([, p]) => p === r.inside);
  if (inside) return `<div class="w-check warn">${t('和「{origin}」里的 {path} 重叠：同一张图只能有一种出处，请去掉其中一个', {origin: esc(originName(inside[0])), path: `<bdi>${esc(home(inside[1]))}</bdi>`})}</div>`;
  const text = {missing: t('这个文件夹不存在'), denied: t('读不到这个文件夹：没有访问权限'), file: t('这不是文件夹'), empty: t('没有找到图片：只读取 JPG、PNG、WebP、GIF（包括子文件夹）')}[r.status];
  if (text) return `<div class="w-check warn">${text}</div>`;
  const unreadable = r.unreadable ? t('，{n} 处读不到（同步时跳过，已有的图保留）', {n: number(r.unreadable)}) : '';
  return `<div class="w-check">${r.partial ? t('至少 {n} 张图片，还没数完', {n: number(r.images)}) : t('{n} 张图片', {n: number(r.images)})}${unreadable}</div>`;
}
function renderWelcome() {
  const origins = (W.origins || []).map(o => [o.id, o.label]);
  const recent = W.recent || [];
  const im = W.importing;
  const entry = (act, title, note, on = false) => `<button class="w-entry${on ? ' on' : ''}" data-act-w="${act}" ${im ? 'disabled' : ''}><b>${title}</b><small>${note}</small></button>`;
  const importing = !im ? '' : `<div class="w-form w-import"><p class="w-line"><b>${t('正在导入 {file}', {file: `<bdi>${esc(im.file)}</bdi>`})}</b></p>
    <p class="w-note">${esc(IMPORT_STAGES[im.stage] || t('正在导入'))}${im.total ? `　${Math.floor(im.done / im.total * 100)}%` : '…'}</p>
    <div class="w-track"><span style="width:${im.total ? Math.min(100, im.done / im.total * 100) : 0}%"></span></div>
    <div class="sp-actions" style="justify-content:flex-start"><button class="btn" data-act-w="import-cancel" ${im.cancelling ? 'disabled' : ''}>${im.cancelling ? t('正在取消…') : t('取消')}</button></div></div>`;
  const form = !W.form || im ? '' : `<div class="w-form">
    <p class="w-note">${t('按图片来自哪里分别添加文件夹，每类可以有多个。子文件夹会一起读取；图片保留在原位置，不复制。选 X 或 Pixiv 的文件夹才能用以图搜图、画师回查。')}</p>
    <div class="w-cols">${origins.map(([id, label]) => `<div class="w-col-box"><h3>${esc(label)}</h3>
      ${W.seq.filter(([o]) => o === id).map(([, p]) => `<div class="w-picked"><span title="${esc(p)}"><bdi>${esc(home(p))}</bdi></span><button data-drop="${esc(p)}" title="${t('不添加这个文件夹')}">×</button></div>${folderCheck(id, p)}`).join('')}
      <button class="btn" data-pick="${id}">${t('添加文件夹…')}</button></div>`).join('')}</div>
    ${W.notes.map(n => `<p class="w-note">${n}</p>`).join('')}
    ${W.photosOk ? `<label class="w-line"><input type="checkbox" id="wphotos" ${W.photos ? 'checked' : ''}> ${t('同时读取 iCloud 照片（本机「照片」图库，按存图的 App 区分 X 和 Pixiv）')}</label>` : ''}
    <div class="w-line"><span>${t('名字')}</span><input type="text" id="wname" spellcheck="false" autocorrect="off" autocapitalize="off" placeholder="${t('新图库')}" value="${esc(W.name)}"></div>
    <p class="w-note">${t('保存在 {path}', {path: esc(home(W.home))})}</p>
    ${W.created ? `<div class="w-created"><p>${t('{done}，保存在 {path}，但没能加入最近图库列表：{reason}', {done: `<b>${t('图库已经建好')}</b>`, path: `<bdi>${esc(home(W.created.created))}</bdi>`, reason: esc(tb(W.created.error))})}</p>
      <p class="w-note">${t('打开它会再试一次加入列表；再点创建会另建一个带编号的图库。')}</p>
      <div class="sp-actions" style="justify-content:flex-start"><button class="btn primary" data-act-w="open-created">${t('打开这个图库')}</button><button class="btn" data-act-w="create-again">${t('仍然新建一个')}</button></div></div>`
      : `<div class="sp-actions" style="justify-content:flex-start"><button class="btn primary" data-act-w="create">${t('创建并打开')}</button></div>`}</div>`;
  document.getElementById('wcol').innerHTML = `<div class="w-head"><img src="icon.png" alt=""><h1>Illustash</h1></div>
    ${recent.length ? `<p class="w-note">${t('最近的图库')}</p><div class="w-recent">${recent.map(l => `<button data-open="${esc(l.path)}" ${im ? 'disabled' : ''}><b>${esc(l.name)}</b><small><bdi>${esc(home(l.path))}</bdi></small></button>`).join('')}</div>`
      : `<p class="w-note">${t('还没有图库。')}</p>`}
    <div class="w-entries">
      ${entry('new', t('新建图库'), t('选择图片所在的文件夹，从头识别。'), W.form && !im)}
      ${entry('pick-library', t('打开已有图库…'), t('打开之前建好的图库（.pilib）。'))}
      ${entry('import', t('从导出包导入…'), t('导入另一台电脑或别人导出的图库（.zip），识别结果和整理记录都在里面。'), !!im)}
    </div>
    ${importing}${form}<p class="w-error" id="werr">${esc(W.error)}</p>`;
}
const keepName = () => { W.name = document.getElementById('wname')?.value ?? W.name; W.photos = document.getElementById('wphotos')?.checked ?? W.photos; };
// Check the picked folders: count the new ones, and let a folder already read with another of the same origin go.
async function inspectFolders(fresh) {
  const seq = W.seq, paths = seq.map(([, p]) => p);
  const found = await invoke('welcome_inspect', {paths, count: fresh});
  if (W.seq !== seq) return;   // the list changed meanwhile; that change checks again
  const drop = [];
  for (const r of found) {
    W.info[r.path] = r.counted ? r : {...(W.info[r.path] || r), inside: r.inside, status: r.status};
    const mine = seq.find(([, p]) => p === r.path), holder = r.inside && seq.find(([, p]) => p === r.inside);
    if (holder && holder[0] === mine[0]) drop.push([r.path, r.inside]);
  }
  if (drop.length) {
    W.seq = seq.filter(([, p]) => !drop.some(([d]) => d === p));
    W.notes = drop.map(([p, by]) => t('{path} 已包含在 {folder} 里，不重复添加。', {path: `<bdi>${esc(home(p))}</bdi>`, folder: `<bdi>${esc(home(by))}</bdi>`}));
    for (const [p] of drop) delete W.info[p];
    renderWelcome();
    return inspectFolders([]);
  }
  renderWelcome();
}
// #115: each create and import carries a request id; the shell runs a second delivery of the same id only once.
const requestId = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
// One picker at a time: a double click must not open a second picker (and import or add twice).
let picking = false;
async function pick(kind, multiple) {
  if (picking) return {};
  picking = true;
  try { return await invoke('welcome_pick', {kind, multiple}); } finally { picking = false; }
}
async function importArchive(path) {
  W.importing = {file: path.split(/[\\/]/).pop(), stage: 'reading'}; W.error = ''; renderWelcome();
  const poll = setInterval(async () => {
    const s = await invoke('welcome_import_status').catch(() => ({}));
    if (W.importing && s.stage) { Object.assign(W.importing, s); if (!s.total) { delete W.importing.done; delete W.importing.total; } renderWelcome(); }
  }, 300);
  try { await invoke('welcome_import', {request: requestId(), path}); }   // success replaces this page with the new library
  catch (err) { W.importing = null; W.error = tb(String(err)); busy(false); renderWelcome(); }
  finally { clearInterval(poll); }
}
document.getElementById('welcome').onclick = e => { const b = e.target.closest('button'); return b ? welcomeAct(b.dataset) : undefined; };
// 名字框里按 Enter 等于点「创建并打开」（#422）；输入法组字时的 Enter 是上屏，不算。只在那个按钮画着时才算：
// 导入进行中、或图库已经建好等你选「打开」还是「仍然新建」时不另建一个。
document.getElementById('welcome').onkeydown = e => {
  if (e.key !== 'Enter' || e.target.id !== 'wname' || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  if (W.form && !W.importing && !W.created) return welcomeAct({actW: 'create'});
};
async function welcomeAct(d) {
  keepName(); W.error = '';
  // The shell's own errors are already in the page's language; the core's are Chinese templates for tb().
  const fail = err => { W.error = tb(String(err)); busy(false); renderWelcome(); };
  try {
    if (d.open) { busy(true); await invoke('welcome_open', {path: d.open}); }
    else if (d.actW === 'new') { W.form = !W.form || !!W.importing; renderWelcome(); }
    else if (d.actW === 'pick-library') {
      const r = await pick('library', false);
      if (r.paths?.[0]) { busy(true); await invoke('welcome_open', {path: r.paths[0]}); }
    }
    else if (d.actW === 'import') {
      const r = await pick('zip', false);
      if (r.paths?.[0]) await importArchive(r.paths[0]);
    }
    else if (d.actW === 'import-cancel') { W.importing.cancelling = true; renderWelcome(); await invoke('welcome_import_cancel'); }
    else if (d.pick) {
      const r = await pick('folder', true);
      const fresh = (r.paths || []).filter(p => !W.seq.some(([, q]) => q === p));
      if (!fresh.length) return;
      W.seq = [...W.seq, ...fresh.map(p => [d.pick, p])]; W.notes = [];
      renderWelcome();
      await inspectFolders(fresh);
    }
    else if (d.drop) { W.seq = W.seq.filter(([, p]) => p !== d.drop); delete W.info[d.drop]; W.notes = []; renderWelcome(); if (W.seq.length) await inspectFolders([]); }
    else if (d.actW === 'create') {
      const sources = W.seq.map(([preset, path]) => ({kind: 'folder', path, preset}));
      if (W.photos) sources.push({kind: 'photos'});
      if (!sources.length) { fail(t('请至少添加一个文件夹')); return; }
      // 按钮在创建期间是禁用的；名字框里的 Enter 绕过按钮，这里挡住第二次。
      if (W.creating) return;
      busy(true); W.creating = true;
      // An empty name is the placeholder's, in the page's language (the core names it 新图库 otherwise).
      let r; try { r = await invoke('welcome_create', {request: requestId(), name: W.name.trim() ? W.name : t('新图库'), sources}); } finally { W.creating = false; }
      // Published but not listed (#97): offer the package instead of making a second, numbered one.
      if (r?.created) { W.created = r; busy(false); renderWelcome(); }
    }
    else if (d.actW === 'open-created') { busy(true); await invoke('welcome_open', {path: W.created.created}); }
    else if (d.actW === 'create-again') { W.created = null; renderWelcome(); }
  } catch (err) { fail(err); }
}
// 启动失败、升级确认、抢救确认三组按钮，同时只显示一组。
const showActs = id => { for (const acts of ['failActs', 'upgradeActs', 'rescueActs']) document.getElementById(acts).hidden = acts !== id; };
// 外壳在服务启动失败时调用，显示原因和最后几行输出。
window.showError = (msg, log) => {
  try { window.currentDiagnostic = JSON.parse(log || '{}').current || null; } catch { window.currentDiagnostic = null; }
  document.getElementById('diagnosticActions').hidden = false;
  document.body.classList.add('failed');
  window.splash?.halt();
  busy(false);
  showActs('failActs');
  document.getElementById('msg').textContent = msg;
  const pre = document.getElementById('log');
  pre.textContent = log || ''; pre.hidden = !log;
};
// 检查发现图库数据库损坏时外壳调用（#212）：说明怎么处理，按钮同启动失败。note 是本地服务的中文原文，经 tb() 翻译。
// 损坏的是 source.sqlite 时（rescue）改为「抢救重建」：外壳带 --rescue-source 重新启动本地服务，进度照常显示在这一页（#228）。
window.showDamage = (note, rescue) => {
  window.showError(tb(note), '');
  if (rescue) showActs('rescueActs');
};
// 外壳发现图库是旧格式时调用（#193）：说明升级会发生什么，用户确认后外壳带 --upgrade 重新启动本地服务。
// note 是本地服务的中文原文，和图库页一样经 tb() 翻译。
window.showUpgrade = (name, note) => {
  document.body.classList.add('failed');
  window.splash?.halt();
  busy(false);
  showActs('upgradeActs');
  document.getElementById('msg').textContent = `${t('「{name}」需要升级', {name})}\n${tb(note)}`;
  const pre = document.getElementById('log'); pre.textContent = ''; pre.hidden = true;
};
</script></body></html>
