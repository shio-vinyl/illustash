<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illustash</title><link rel="icon" href="/favicon.svg"><script src="/theme.js"></script><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/rail.css"><link rel="stylesheet" href="/css/library.css"><link rel="stylesheet" href="/css/detail.css"><link rel="stylesheet" href="/css/galleries.css"><link rel="stylesheet" href="/css/catalog.css"><link rel="stylesheet" href="/css/character.css"><link rel="stylesheet" href="/css/tidy.css"><link rel="stylesheet" href="/css/settings.css"><link rel="stylesheet" href="/css/overlays.css"></head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-bg"></div><div class="sp-col"><div class="sp-icon"><svg viewBox="302 291 650 650" fill="none"></svg></div><div class="sp-name">Illustash</div><div class="sp-status"><span class="sp-text" data-t>正在打开图库…</span><span class="sp-track"><span class="sp-fill"></span></span></div></div></div>
<div class="app">
  <aside class="rail" id="rail">
    <div class="rail-top"><button class="rail-brand" id="brand" title="Illustash" aria-haspopup="dialog" aria-expanded="false" aria-controls="libraryPop"><svg class="logo-mark" viewBox="302 291 650 650" fill="none" aria-hidden="true"><defs><linearGradient id="lm-inside" x1="517" y1="312" x2="728" y2="664" gradientUnits="userSpaceOnUse"><stop stop-color="#b3b6f3"/><stop offset=".36" stop-color="#7f83dc"/><stop offset=".7" stop-color="#4f58b3"/><stop offset="1" stop-color="#293688"/></linearGradient><linearGradient id="lm-paper" x1="600" y1="449" x2="547" y2="701" gradientUnits="userSpaceOnUse"><stop stop-color="#fbfafe"/><stop offset=".38" stop-color="#ebeafc"/><stop offset=".72" stop-color="#cdccf7"/><stop offset="1" stop-color="#9795e6"/></linearGradient><linearGradient id="lm-right" x1="702" y1="583" x2="907" y2="730" gradientUnits="userSpaceOnUse"><stop stop-color="#e5e3fb"/><stop offset=".43" stop-color="#bbbbf1"/><stop offset="1" stop-color="#858ae1"/></linearGradient><linearGradient id="lm-front" x1="367" y1="502" x2="767" y2="920" gradientUnits="userSpaceOnUse"><stop stop-color="#e2e1fb"/><stop offset=".32" stop-color="#c0bff5"/><stop offset=".66" stop-color="#9597e9"/><stop offset="1" stop-color="#5b68d2"/></linearGradient><radialGradient id="lm-foldShade" cx="0" cy="0" r="1" gradientTransform="translate(818 805) rotate(-155) scale(171 239)" gradientUnits="userSpaceOnUse"><stop stop-color="#3447b8" stop-opacity=".38"/><stop offset="1" stop-color="#5960c8" stop-opacity="0"/></radialGradient><linearGradient id="lm-rim" x1="383" y1="511" x2="898" y2="568" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".92"/><stop offset=".74" stop-color="#fbfafe"/><stop offset="1" stop-color="#e4e2fb" stop-opacity=".65"/></linearGradient></defs><path d="M416 418L560 330C603 303 644 302 689 327L828 412C872 438 898 466 899 509C900 540 900 567 900 595V705C901 756 882 792 844 817L687 908C642 931 603 931 561 906L416 822C374 794 355 760 355 707V583C355 538 355 497 371 463C379 445 395 431 416 418Z" fill="url(#lm-inside)"/><path d="M399 532C405 511 417 500 444 493L695 423C733 411 761 432 768 465L807 648C778 676 746 688 701 670Z" fill="url(#lm-paper)"/><path d="M399 532C406 512 419 500 444 493L696 423C732 413 761 432 768 466" stroke="#fff" stroke-opacity=".65" stroke-width="2"/><path d="M899 509C900 540 900 567 900 595V705C901 756 882 792 844 817L782 855C801 802 784 759 760 731C738 704 710 677 672 656L694 666C739 687 774 677 806 649L849 603C880 570 900 542 899 509Z" fill="url(#lm-right)"/><path d="M371 463C355 497 355 538 355 583V707C355 760 374 794 416 822L561 906C603 931 642 931 687 908L782 854C800 807 786 762 760 731C738 704 710 677 672 656L417 538C379 519 359 495 371 463Z" fill="url(#lm-front)"/><path d="M371 463C355 497 355 538 355 583V707C355 760 374 794 416 822L561 906C603 931 642 931 687 908L782 854C800 807 786 762 760 731C738 704 710 677 672 656L417 538C379 519 359 495 371 463Z" fill="url(#lm-foldShade)"/><path d="M371 463C359 495 379 519 417 535L695 663C739 684 773 674 804 647L847 601C878 568 900 542 899 509C902 542 882 572 851 605L808 651C775 680 739 690 693 669L416 541C377 522 357 495 371 463Z" fill="url(#lm-rim)"/></svg><span class="brand-lib" id="brandLib"></span></button></div>
    <nav class="rail-l1" id="railEntries" aria-label="导航" data-t-attr="aria-label"><span class="rail-tab" id="railTab" aria-hidden="true"></span><a class="rail-entry" data-entry="library" href="#/days"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.8"/><rect x="11" y="3" width="6" height="6" rx="1.8"/><rect x="3" y="11" width="6" height="6" rx="1.8"/><rect x="11" y="11" width="6" height="6" rx="1.8"/></svg><span class="rail-name" data-t>图库</span><span class="rail-dot" hidden></span></a><a class="rail-entry" data-entry="catalog" href="#/characters"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="3.5" width="3.6" height="13" rx="1"/><rect x="8.4" y="5.5" width="3.6" height="11" rx="1"/><path d="m13.3 6.4 3.1-.8 2.2 10.1-3.1.8Z"/></svg><span class="rail-name" data-t>资料库</span><span class="rail-dot" hidden></span></a><a class="rail-entry" data-entry="galleries" href="#/galleries"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="11" rx="2"/><path d="m3.5 13.5 4-4 3 3 2-2 4 4"/><circle cx="13" cy="8" r="1.2"/></svg><span class="rail-name" data-t>画廊</span><span class="rail-dot" hidden></span></a><a class="rail-entry" data-entry="tidy" href="#/groups"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 11h3.6l1.2 2h3.4l1.2-2h3.6"/><path d="M5.6 4.5h8.8a1 1 0 0 1 1 .8l1.1 5.7v4a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 3.5 15v-4l1.1-5.7a1 1 0 0 1 1-.8Z"/></svg><span class="rail-name" data-t>整理</span><span class="rail-dot" hidden></span></a></nav>
    <span class="rail-sep" aria-hidden="true"></span>
    <div class="rail-l2" id="railLayer"><div class="rail-scroll" id="railScroll"><div class="rail-hint" id="railHint" aria-hidden="true"></div><div class="rail-items" id="railItems"></div><span class="rail-ind" id="railInd" aria-hidden="true"></span></div></div>
    <div class="rail-foot">
      <button class="rail-foot-button" id="updateButton" hidden title="有新版本" data-t-attr="title"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.5v9M6.2 9 10 12.8 13.8 9M4 16h12"/></svg><span class="task-badge"></span><span class="rail-label" id="updateLabel" data-t>更新</span></button>
      <button class="rail-foot-button rail-sync" id="taskButton" title="任务" data-t-attr="title" aria-haspopup="dialog" aria-expanded="false" aria-controls="taskPanel"><svg class="sync-ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="14"/><circle class="sync-arc" cx="18" cy="18" r="14" pathLength="100"/></svg><span class="task-badge" id="taskBadge" hidden></span><span class="rail-label" id="taskLabel" data-t>任务</span></button>
      <a class="rail-foot-button" href="#/settings" id="settingsLink" title="设置" data-t-attr="title"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.4 4.5 8.8 2.5h2.4l.4 2 1.2.5 1.7-1.2 1.7 1.7-1.2 1.7.5 1.2 2 .4v2.4l-2 .4-.5 1.2 1.2 1.7-1.7 1.7-1.7-1.2-1.2.5-.4 2H8.8l-.4-2-1.2-.5-1.7 1.2-1.7-1.7 1.2-1.7-.5-1.2-2-.4V8.8l2-.4.5-1.2-1.2-1.7 1.7-1.7 1.7 1.2Z"/><circle cx="10" cy="10" r="2.4"/></svg><span class="rail-label" data-t>设置</span></a>
    </div>
  </aside>
  <div class="menu glass library-pop" id="libraryPop" role="dialog" aria-label="图库" data-t-attr="aria-label" hidden></div>
  <div class="rail-peek glass" id="railPeek" aria-hidden="true" hidden></div>
  <main>
    <section class="workspace">
      <div class="content">
        <header class="page-head" id="pageHead"><button class="icon" id="sidebarToggle" title="二级导航" aria-label="二级导航" aria-expanded="false" aria-controls="railLayer" data-t-attr="title aria-label"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 6h13M3.5 10h13M3.5 14h13"/></svg></button><button class="icon" id="backButton" hidden title="后退" aria-label="后退" data-t-attr="title aria-label"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 4.5 6.5 10l5.5 5.5"/></svg></button><div class="page-heading" id="heading"></div><div class="page-actions top-actions"><button class="jump" id="jumpButton" title="跳到角色（⌘K）" aria-label="跳到角色" data-t-attr="title aria-label"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.8 3.8"/></svg><span data-t>跳到角色</span><kbd>⌘K</kbd></button>
          <button class="icon nsfw-toggle" id="nsfwButton"><span aria-hidden="true">NSFW</span></button><span class="view-anchor"><button class="icon" id="viewButton" title="视图选项" aria-label="视图选项" data-t-attr="title aria-label" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h7M15 6h1M4 14h1M9 14h7"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="14" r="2"/></svg></button><div class="menu glass view-pop" id="viewPopover" role="dialog" aria-label="视图选项" data-t-attr="aria-label" hidden></div></span><button class="icon" id="undoButton" disabled aria-label="撤销" data-t-attr="aria-label"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5 4 8.5 7.5 12"/><path d="M4.5 8.5H12a4 4 0 0 1 0 8H9"/></svg></button><button class="icon" id="helpButton" title="快捷键" aria-label="快捷键" data-t-attr="title aria-label"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="M8 7.8a2.2 2.2 0 1 1 3 2c-.6.3-1 .8-1 1.4v.4M10 14.2v.1"/></svg></button></div></header>
        <div class="toolbar page-tools" id="toolbar"></div>
        <p class="muted-note" id="routeLoading" role="status"></p>
        <div id="errorBanner" role="alert" hidden></div><div id="damageBanner" role="alert" hidden></div>
        <div id="guideNotice" class="guide-notice" role="status" hidden></div>
        <div class="viewport" id="viewport" tabindex="0" aria-label="图片浏览区域" data-t-attr="aria-label">
          <div id="grid" class="grid" role="group" aria-label="图片" data-t-attr="aria-label"></div>
          <div id="marquee" class="marquee" hidden></div>
          <div class="empty" id="empty" hidden></div>
          <div id="charIndex" class="char-index" hidden></div>
          <div id="settingsPage" hidden></div>
          <div id="groupsPage" class="groups-page" hidden></div>
          <div id="homePage" class="home-page" hidden></div>
          <div id="calendarPage" class="calendar-page" hidden></div>
        </div>
        <div class="footer"><span id="resultCount"></span><span id="hint"></span></div>
      </div>
      <aside id="inspector" class="inspector" aria-label="图片详情" data-t-attr="aria-label" hidden></aside>
    </section>
  </main>
</div>
<div class="menu glass task-pop" id="taskPanel" tabindex="-1" role="dialog" aria-label="任务" data-t-attr="aria-label" hidden></div>
<div id="tour" class="tour" hidden><div class="tour-hole"></div><div class="tour-bubble" role="dialog" aria-live="polite" aria-label="使用引导" data-t-attr="aria-label"></div></div>
<div id="nudge" class="nudge glass" role="status" hidden></div>
<div id="checklist" class="checklist" hidden></div>
<div id="selectionBar" class="selection-bar" hidden></div>
<div id="toast" class="toast" role="status" hidden><span id="toastText"></span><button id="toastAct" class="toast-undo" hidden></button><button id="toastUndo" class="toast-undo" data-t hidden>撤销</button></div>
<div id="viewer" class="viewer" tabindex="-1" role="dialog" aria-label="大图" data-t-attr="aria-label" hidden>
  <div class="viewer-top"><span id="viewerCount"></span><span class="viewer-size" id="viewerSize"></span><div class="spacer"></div><button class="icon" id="viewerPrev" aria-label="上一张" data-t-attr="aria-label">‹</button><button class="icon" id="viewerNext" aria-label="下一张" data-t-attr="aria-label">›</button><button class="icon" id="viewerClose" aria-label="关闭" data-t-attr="aria-label">×</button></div>
  <div class="viewer-stage" id="viewerStage"></div>
  <div class="viewer-bar" id="viewerBar"></div>
</div>
<dialog id="picker" class="palette glass-scrim"><div id="pickerSubject" class="picker-staged" hidden></div><div class="palette-head"><input id="pickerSearch" type="search" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off" aria-label="搜索角色" data-t-attr="aria-label"></div><div id="pickerStaged" class="picker-staged" hidden></div><div id="pickerResults" class="picker-results" role="listbox"></div><div class="palette-foot" id="pickerFoot"></div></dialog>
<dialog id="ocSplitDialog" class="relate glass-scrim"><div class="dialog-top"><h2 class="title-section" id="ocSplitTitle" data-t>按相似细分</h2><button class="icon" id="ocSplitClose" aria-label="关闭" data-t-attr="aria-label">×</button></div><div id="ocSplitBody"></div></dialog><dialog id="relateDialog" class="relate glass-scrim"><div class="dialog-top"><h2 class="title-section" id="relateTitle" data-t>图片关系</h2><button class="icon" id="relateClose" aria-label="关闭" data-t-attr="aria-label">×</button></div><div id="relateBody"></div></dialog>
<dialog id="help" class="glass-scrim"><form method="dialog" class="dialog-top"><h2 class="title-section" data-t>键盘快捷键</h2><button class="icon" aria-label="关闭" data-t-attr="aria-label">×</button></form>
  <dl class="shortcuts" id="helpKeys"></dl>
  <p class="dialog-note" data-t>人工判定优先于自动识别，不会被后续识别覆盖。</p>
</dialog>
<script src="/i18n.js" defer></script>
<script src="/splash.js" defer></script>
<script type="module" src="/app.js"></script>
</body></html>
