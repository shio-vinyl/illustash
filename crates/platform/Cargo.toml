[package]
name = "illustash-platform"
version = "0.4.0"
edition = "2021"
rust-version = "1.82"
description = "Illustash existing platform capabilities"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
illustash-core = { path = "../core" }
rusqlite = { version = "0.41", default-features = false, features = ["cache", "bundled", "functions", "backup", "hooks"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libc = "0.2"
md-5 = "0.10"
chrono = "0.4"
image = { version = "=0.25.6", default-features = false, features = ["png", "gif", "webp", "tiff", "bmp", "ico", "pnm", "tga"] }
mozjpeg = { version = "0.10", default-features = false, features = ["with_simd"] }

[dev-dependencies]
getrandom = "0.3"

# 2026-10-29 用户定：每个 unsafe 块和 unsafe impl 都写 `// SAFETY:` 注释；生产代码不用 unwrap，
# 确实不会失败的地方用 expect 写明理由。测试里的 unwrap 由仓库根目录的 clippy.toml 放行。
[lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

# dev 构建少带调试信息（#362）：自己的 crate 只带行号表，panic 和测试失败的回溯里仍有文件名和行号；
# 第三方依赖不带调试信息。只动 dev profile，release 不变。做法和数字见 docs/LOCAL_CHECKS.md。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.illustash-core]
debug = "line-tables-only"
